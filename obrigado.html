<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="theme-color" content="#111113">
  <title>Obrigado | Dr. Felipe Villaça</title>
  <meta name="description" content="Solicitação recebida pela equipe do Dr. Felipe Villaça.">
  <meta name="robots" content="noindex, nofollow">
  <style>
    :root{--black:#111113;--gold:#b79b69;--cream:#f6f2e9;--muted:#b7b0a2}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--black);color:var(--cream);font-family:Arial,sans-serif;text-align:center;padding:2rem}
    main{max-width:620px;border:1px solid rgba(183,155,105,.35);padding:clamp(2rem,6vw,5rem);background:#19191b}
    .eyebrow{color:var(--gold);font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;font-weight:700}
    h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(2.3rem,6vw,4rem);line-height:1.1;margin:1rem 0}
    p{color:var(--muted);font-size:1.05rem;line-height:1.7;margin:0 auto 2rem}
    a{display:inline-block;color:#17130d;background:var(--gold);padding:1rem 1.5rem;text-decoration:none;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.75rem}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Solicitação recebida</div>
    <h1>Obrigado pelo seu contato.</h1>
    <p>Recebemos suas informações. Nossa equipe entrará em contato pelo WhatsApp para agendar sua avaliação.</p>
    <a href="/lp.html">Voltar para a página</a>
  </main>
  <script src="/assets/js/analytics.js" charset="utf-8" defer></script>
</body>
</html>
